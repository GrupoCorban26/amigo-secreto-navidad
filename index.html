<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Secreto de Navidad 🎁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --rojo: #c0262d;
      --rojo-osc: #7a1016;
      --verde: #1f6f43;
      --verde-osc: #0d3b24;
      --dorado: #f4c95d;
      --crema: #fff8ec;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 50% 30%, var(--verde) 0%, var(--verde-osc) 60%, #061a10 100%);
      color: var(--crema);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .nieve {
      position: fixed; top: -10px;
      color: #fff; pointer-events: none;
      animation: caer linear infinite;
      opacity: .85;
      z-index: 0;
    }
    @keyframes caer {
      to { transform: translateY(110vh) translateX(var(--deriva)); }
    }
    .tarjeta {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      background: linear-gradient(160deg, var(--rojo) 0%, var(--rojo-osc) 100%);
      border: 3px solid var(--dorado);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 0 0 6px rgba(255,255,255,.06);
      animation: entrar .7s cubic-bezier(.2,.9,.3,1.3);
    }
    @keyframes entrar { from { transform: scale(.7); opacity: 0; } }
    .regalo { font-size: 64px; display: inline-block; animation: latir 1.6s ease-in-out infinite; }
    @keyframes latir { 50% { transform: scale(1.12) rotate(-6deg); } }
    h1 {
      font-family: 'Mountains of Christmas', cursive;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.15;
      color: var(--dorado);
      margin: 12px 0 14px;
      text-shadow: 0 3px 0 rgba(0,0,0,.25);
    }
    p { font-size: 16px; line-height: 1.6; opacity: .95; }
    .botones {
      margin-top: 28px;
      display: flex; gap: 16px; justify-content: center; align-items: center;
      min-height: 56px;
    }
    button {
      font-family: inherit; font-weight: 600; font-size: 18px;
      border: none; border-radius: 999px;
      padding: 14px 38px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,.25);
    }
    #si { background: var(--dorado); color: var(--rojo-osc); transition: transform .15s; }
    #si:hover { transform: translateY(-2px) scale(1.05); }
    #si:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
    #no {
      background: var(--crema); color: var(--verde-osc);
      transition: left .25s ease, top .25s ease;
      z-index: 10;
      touch-action: none;
    }
    .oculto { display: none !important; }
    #gracias h1 { font-size: clamp(34px, 8vw, 48px); }
    .confeti {
      position: fixed; width: 10px; height: 14px; top: -20px;
      pointer-events: none; z-index: 20;
      animation: confeti linear forwards;
    }
    @keyframes confeti {
      to { transform: translateY(110vh) rotate(720deg); }
    }
  </style>
</head>
<body>
  <main class="tarjeta" id="invitacion">
    <div class="regalo">🎁</div>
    <h1>¿Quieres participar en el Amigo Secreto de Navidad?</h1>
    <p>Este año queremos compartir la magia de la Navidad con regalos, sorpresas y muchas risas. ¡Anímate a ser parte!</p>
    <div class="botones">
      <button id="si">Sí 🎄</button>
      <button id="no">No</button>
    </div>
  </main>

  <main class="tarjeta oculto" id="gracias">
    <div class="regalo">🎅</div>
    <h1>¡Gracias por participar!</h1>
    <p>Pronto recibirás el nombre de tu amigo secreto. ¡Prepárate para sorprender! ✨🎄</p>
  </main>

  <script>
    // Nieve
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'nieve';
      c.textContent = '❄';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = (8 + Math.random() * 16) + 'px';
      c.style.animationDuration = (6 + Math.random() * 10) + 's';
      c.style.animationDelay = (-Math.random() * 16) + 's';
      c.style.setProperty('--deriva', (Math.random() * 80 - 40) + 'px');
      document.body.appendChild(c);
    }

    const si = document.getElementById('si');
    const no = document.getElementById('no');
    const invitacion = document.getElementById('invitacion');
    const gracias = document.getElementById('gracias');
    const DISTANCIA = 100;

    function moverNo(x, y) {
      const r = no.getBoundingClientRect();
      if (no.style.position !== 'fixed') {
        // Fijar en su posición actual antes de animar el salto
        no.style.position = 'fixed';
        no.style.left = r.left + 'px';
        no.style.top = r.top + 'px';
        no.offsetWidth; // forzar reflow para que la transición funcione
      }
      const margen = 10;
      const maxX = window.innerWidth - r.width - margen;
      const maxY = window.innerHeight - r.height - margen;
      let nx, ny, intentos = 0;
      do {
        nx = margen + Math.random() * (maxX - margen);
        ny = margen + Math.random() * (maxY - margen);
        intentos++;
      } while (Math.hypot(nx + r.width / 2 - x, ny + r.height / 2 - y) < DISTANCIA * 2.5 && intentos < 50);
      no.style.left = nx + 'px';
      no.style.top = ny + 'px';
    }

    document.addEventListener('mousemove', (e) => {
      if (no.classList.contains('oculto')) return;
      const r = no.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      if (Math.hypot(e.clientX - cx, e.clientY - cy) < DISTANCIA) moverNo(e.clientX, e.clientY);
    });

    // Móvil / clics que logren llegar / teclado
    no.addEventListener('pointerdown', (e) => { e.preventDefault(); moverNo(e.clientX, e.clientY); });
    no.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; moverNo(t.clientX, t.clientY); }, { passive: false });
    no.addEventListener('click', (e) => { e.preventDefault(); moverNo(e.clientX, e.clientY); });
    no.addEventListener('focus', () => { const r = no.getBoundingClientRect(); moverNo(r.left, r.top); no.blur(); });

    window.addEventListener('resize', () => {
      if (no.style.position === 'fixed') {
        const r = no.getBoundingClientRect();
        no.style.left = Math.min(r.left, window.innerWidth - r.width - 10) + 'px';
        no.style.top = Math.min(r.top, window.innerHeight - r.height - 10) + 'px';
      }
    });

    si.addEventListener('click', () => {
      invitacion.classList.add('oculto');
      no.classList.add('oculto');
      gracias.classList.remove('oculto');
      const colores = ['#f4c95d', '#c0262d', '#ffffff', '#2fa36b', '#ff7b7b'];
      for (let i = 0; i < 120; i++) {
        const c = document.createElement('div');
        c.className = 'confeti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colores[i % colores.length];
        c.style.animationDuration = (2 + Math.random() * 3) + 's';
        c.style.animationDelay = (Math.random() * 1.5) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 7000);
      }
    });
  </script>
</body>
</html>
